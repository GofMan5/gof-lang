name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace
      - name: Build benchmark harness
        run: cargo bench -p gof-bench --no-run

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            command: bash ./scripts/package-release.sh "${RELEASE_VERSION}"
          - os: windows-latest
            shell: pwsh
            command: ./scripts/package-release.ps1 -Version "${env:RELEASE_VERSION}"
          - os: macos-13
            shell: bash
            command: bash ./scripts/package-release.sh "${RELEASE_VERSION}"
          - os: macos-14
            shell: bash
            command: bash ./scripts/package-release.sh "${RELEASE_VERSION}"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package release artifact
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
