name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build benchmark harness
        run: cargo bench -p gof-bench --no-run

  example-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run geometry example
        run: cargo run -q -p gof-cli --bin gof -- run examples/geometry.gof
      - name: Run health gate example
        run: cargo run -q -p gof-cli --bin gof -- run examples/health_gate.gof
      - name: Run portfolio example
        run: cargo run -q -p gof-cli --bin gof -- run examples/portfolio/main.gof
      - name: Run records example
        run: cargo run -q -p gof-cli --bin gof -- run examples/records/main.gof

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/package-release.sh ci-smoke
      - name: Build release package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version ci-smoke
      - name: Upload CI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  docs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Build English book
        run: mdbook build docs/book
      - name: Build Russian book
        run: mdbook build docs/book-ru
