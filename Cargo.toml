[workspace]
members = [
    "compiler/gof-compiler",
    "runtime/gof-runtime",
    "tools/gof-cli",
    "tests/gof-conformance",
    "benchmarks/gof-bench",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
authors = ["gof-lang contributors"]
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
ctrlc = "3.5.1"
csv = "1.4.0"
notify = "8.2.0"
pathdiff = "0.2.3"
predicates = "3.1.3"
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "0.9.8"
